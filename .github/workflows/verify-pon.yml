name: Verify PON Module

# 只编译 airoha-xpon 模块，用于验证 GPON/EPON 代码正确性。
# 与 build-firmware.yml 分开，避免被 airoha-voice / xray-core
# 等无关包的下载失败阻塞。

on:
  workflow_dispatch:
  push:
    paths:
      - 'patches/feeds/pon_drivers/**'
      - '.github/workflows/verify-pon.yml'

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup build environment
        run: |
          sudo apt update
          sudo apt install -y build-essential clang gcc g++ binutils bzip2 gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync unzip wget xsltproc zlib1g-dev file which perl sed make

      - name: Install feeds
        run: |
          find scripts -type f -exec chmod +x {} + 2>/dev/null || true
          find . -maxdepth 3 -name '*.sh' -exec chmod +x {} + 2>/dev/null || true
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash scripts/fix-stale-golang-host.sh

      - name: Select feed providers
        run: FEED_PATCHES_STRICT=1 bash scripts/select-feed-providers.sh

      - name: Apply feed patches
        run: bash scripts/apply-feed-patches.sh

      - name: Configure
        run: |
          cp 2010.config .config
          make defconfig

      - name: Build host tools
        run: |
          # OpenWrt 的 tools/ 阶段必须完整跑一遍：它会构建整套 host 工具链
          # （sed/gcc/binutils/libdeflate-gzip/patch/tar/...）。
          #
          # 教训：单独 make tools/<name>/install 会失败，因为这些目标
          # 依赖 target/linux/prereq 等前置条件，且相互依赖。
          # 第 8 次验证就因此失败：
          #   make: *** [toplevel.mk:272: tools/libdeflate/install] Error 1
          #   bash: staging_dir/host/bin/sed: No such file or directory
          #
          # 正确做法：make tools/install 一次性构建全部 host 工具。
          # 在 GitHub runner 上约 25-40 分钟。
          set -o pipefail
          make tools/install -j$(nproc) BUILD_LOG=1 2>&1 | tail -30

      - name: Download only PON deps
        run: |
          make package/feeds/pon_drivers/airoha-xpon/download V=s -j1 2>&1 | tail -30

      - name: Prepare kernel config
        run: |
          # airoha-pon-frontends 的 Makefile 依赖内核 .config：
          #   make[2]: *** No rule to make target '.../linux-6.18.60/.config',
          #            needed by '.../airoha-pon-frontends/.built'
          # 第 9 次验证就卡在这里（与 PON 代码无关，是构建顺序问题）。
          #
          # 只生成内核配置，不编译内核本体（省时间）。
          set -o pipefail
          # 1) 生成 .config（顶层）
          make defconfig BUILD_LOG=1 2>&1 | tail -5
          # 2) 展开内核源码树（这会创建 build_dir/.../linux-6.18.60/）
          make target/linux/compile BUILD_LOG=1 -j$(nproc) 2>&1 | tail -15 || true
          # 3) 确认 .config 存在
          KCONF=$(ls build_dir/target-*/linux-*/.config 2>/dev/null | head -1)
          if [ -n "$KCONF" ]; then
            echo "✅ 内核配置已生成: $KCONF"
          else
            echo "⚠️ 内核 .config 未生成，列出 build_dir："
            ls build_dir/target-*/linux-*/ 2>/dev/null | head -20
          fi

      - name: Compile airoha-xpon
        run: |
          set -o pipefail
          make package/feeds/pon_drivers/airoha-xpon/compile \
            BUILD_LOG=1 V=s -j1 2>&1 | tee pon-build.log
        continue-on-error: false

      - name: Show build log on failure
        if: failure()
        run: |
          echo "=== errors ==="
          grep -nE "error:|Error [0-9]|warning:|No rule" pon-build.log | head -60 || true
          echo "=== last 100 lines ==="
          tail -100 pon-build.log

      - name: Verify artifacts
        if: success()
        run: |
          echo "=== built kmod ==="
          find bin -name '*airoha-xpon*' -o -name '*.ko' 2>/dev/null | grep -i xpon || true
          find build_dir -name 'airoha-xpon*.ko' 2>/dev/null | head -5
